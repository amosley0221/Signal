name: Build & Release APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["design/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.gate.outputs.publish }}
      has_key: ${{ steps.gate.outputs.has_key }}
      apk: ${{ steps.apk.outputs.file }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Decide whether to publish a release
        id: gate
        env:
          HAS_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          publish=true
          reason=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then publish=false; reason="pull request build"; fi
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then publish=false; reason="not the default branch"; fi
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then publish=false; reason="${{ steps.version.outputs.tag }} already released (bump VERSION_NAME in version.properties to release again)"; fi
          if ! scripts/release-notes.sh "${{ steps.version.outputs.name }}" > /dev/null; then publish=false; reason="CHANGELOG.md has no section for ${{ steps.version.outputs.name }}"; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"
          echo "Publish release: $publish ${reason:+($reason)}"

      - name: Restore release keystore
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signal-release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signal-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        id: apk
        run: |
          APK="Signal-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "file=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.file }}

  agent-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build SignalAgent.exe
        run: npm run build:exe

      - uses: actions/upload-artifact@v4
        with:
          name: agent-exe
          path: agent/dist/SignalAgent.exe

  release:
    needs: [android, agent-windows]
    if: needs.android.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require release signing key
        if: needs.android.outputs.has_key != 'true'
        run: |
          echo "::error::Release signing key is missing, so this version can't be published. Add the SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD repository secrets, then re-run this workflow."
          exit 1

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "${{ needs.android.outputs.version }}" > notes.md
          gh release create "${{ needs.android.outputs.tag }}" \
            "out/${{ needs.android.outputs.apk }}" \
            "out/SignalAgent.exe" \
            --target "${{ github.sha }}" \
            --title "Signal Player ${{ needs.android.outputs.version }}" \
            --notes-file notes.md \
            --latest
